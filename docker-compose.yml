version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - NVIDIA_API_KEYS=${NVIDIA_API_KEYS}
      - NVIDIA_MODEL=nvidia/nemotron-nano-9b-v2
      - HUGGINGFACEHUB_API_TOKEN=${HUGGINGFACEHUB_API_TOKEN}
      - HF_API_KEYS=${HF_API_KEYS}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_STORAGE_BUCKET=documents
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=mortgage_docs
      - QDRANT_TIMEOUT=120
      - QDRANT_BATCH_SIZE=50
      - INPUT_GUARDRAILS_ENABLED=true
      - OUTPUT_GUARDRAILS_ENABLED=true
      - NEMO_GUARDRAILS_ENABLED=true
      - RETRIEVER_TOP_K=10
      - MULTI_QUERY_ENABLED=true
      - MULTI_QUERY_N=3
      - RERANK_ENABLED=true
      - CHUNK_SIZE=1024
      - CHUNK_OVERLAP=50
      - VISION_MODEL=nvidia/llama-3.1-nemotron-nano-vl-8b-v1
      - VISION_TIMEOUT=120
      - VISION_DELAY=2
      - VISION_PDF_ENABLED=true
      - VISION_PDF_PAGE_LIMIT=0
      - OCR_FALLBACK_ENABLED=true
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
    depends_on:
      - qdrant
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  qdrant_data:
